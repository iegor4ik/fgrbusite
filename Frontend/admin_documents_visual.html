<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін - Інші документи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="./CSS/style.css" />
  <link rel="stylesheet" href="./CSS/admin.css" />
  <link rel="stylesheet" href="./CSS/documents.css" />
</head>
<body class="admin-documents-visual">
  <div class="admin-page">
    <input type="checkbox" id="sidebarToggle" class="sidebar-checkbox" />
    <header class="admin-header">
      <label for="sidebarToggle" class="sidebar-toggle-btn" aria-label="Переключити бічну панель">☰</label>
      <div class="admin-header-left">Інші документи</div>
      <div class="admin-header-right">Офіційний сайт Федерація греко-римської боротьби України</div>
    </header>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="sidebar-header"><span class="sidebar-title">Меню</span></div>
        <nav class="sidebar-nav">
          <a href="admin.html"><span class="nav-icon">🏠</span><span class="nav-label">Головна (Дашборд)</span></a>
          <a href="admin_news.html"><span class="nav-icon">📰</span><span class="nav-label">Керування новинами</span></a>
          <a href="admin_gallery.html"><span class="nav-icon">🖼️</span><span class="nav-label">Галерея</span></a>
          <a href="admin_dditionally.html"><span class="nav-icon">⚙️</span><span class="nav-label">Додатково</span></a>
        </nav>
        <button class="logout-btn" type="button" onclick="window.location.href='index.html'">Вийти</button>
      </aside>
      <main class="admin-main admin-documents-visual-main">
        <section class="dashboard-overview">
          <h2>Документи категорії «інше»</h2>
          <p>Перегляд додаткових документів, які відображаються у розділі федерації.</p>
          <div class="admin-document-search"><label for="otherDocumentSearch">Пошук за назвою</label><input id="otherDocumentSearch" type="search" placeholder="Введіть назву документа..." /></div>
        </section>
        <div class="dashboard-cards" id="otherDocumentsList"></div>
      </main>
    </div>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Перемкнути тему"><span class="theme-icon">🌙</span></button>
  <script src="./JS/main.js" defer></script>
  <script src="./JS/admin_documents_visual.js" defer></script>
</body>
</html>
